spring:
  application:
    name: tinylink

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

server:
  port: ${PORT:8080}

tinylink:
  base-url: ${TINYLINK_BASE_URL:http://localhost:8080}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8082,http://localhost:8080}

  short-code:
    length: 6
    max-attempts: 10

  rate-limits:
    requests-per-minute: 5
    request-per-hour: 10

  cache:
    ttl-minutes: 30
    cleanup:
      interval-minutes: 5
      expired-urls-batch-size: 100

logging:
  level:
    com.princethakur.tinylink: DEBUG
    org.springframework.data.redis: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
